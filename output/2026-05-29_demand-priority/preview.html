<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>需求优先级怎么判断｜图文预览</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      background: #eef4ff;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #0b1f4d;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(15, 45, 90, 0.12);
    }
    img {
      width: 100%;
      display: block;
      border-radius: 12px;
    }
    .meta {
      margin-top: 10px;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <h1>需求优先级怎么判断｜图文预览</h1>
  <div class="grid">
    
      <div class="card">
        <img src="./images/page_01.svg" alt="page 1" />
        <div class="meta">第 1 页｜需求优先级怎么判断</div>
      </div>

      <div class="card">
        <img src="./images/page_02.svg" alt="page 2" />
        <div class="meta">第 2 页｜先判断是不是关键问题</div>
      </div>

      <div class="card">
        <img src="./images/page_03.svg" alt="page 3" />
        <div class="meta">第 3 页｜再拆成三个判断维度</div>
      </div>

      <div class="card">
        <img src="./images/page_04.svg" alt="page 4" />
        <div class="meta">第 4 页｜不确定时先验证</div>
      </div>

      <div class="card">
        <img src="./images/page_05.svg" alt="page 5" />
        <div class="meta">第 5 页｜用一句公式做初筛</div>
      </div>

      <div class="card">
        <img src="./images/page_06.svg" alt="page 6" />
        <div class="meta">第 6 页｜最后帮你快速记住重点</div>
      </div>
  </div>
</body>
</html>
